name: Web CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# corepack 找不到已缓存的 pnpm 时默认会交互式询问，CI 里会挂住。
env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

jobs:
  web-quality:
    name: Web quality (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # 版本来源是仓库里的 .node-version，与本地 fnm 读的是同一个文件。
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version

      # pnpm 经 Corepack 获取，不用第三方 action：ADR-0003 与 M1 的要求都是
      # 「packageManager 精确固定 pnpm 11.27.0，安装方式在 Linux CI 上实际验证」，
      # 走 Corepack 才真的验证了那条链路。
      - name: Enable pnpm via Corepack
        run: corepack enable pnpm

      # 断言而不是打印：版本漂移必须让 CI 失败，否则「锁定版本」只是文档上的承诺。
      - name: Assert toolchain versions
        run: |
          set -euo pipefail
          node_v="$(node -v)"
          corepack_v="$(corepack --version)"
          pnpm_v="$(pnpm -v)"
          echo "node=$node_v corepack=$corepack_v pnpm=$pnpm_v"
          test "$node_v" = "v24.21.0" || { echo "::error::Node 版本与 ADR-0003 不符: $node_v"; exit 1; }
          test "$corepack_v" = "0.36.0" || { echo "::error::Corepack 版本与 M1 口径不符: $corepack_v"; exit 1; }
          test "$pnpm_v" = "11.27.0" || { echo "::error::pnpm 版本与 packageManager 不符: $pnpm_v"; exit 1; }

      - name: Install (locked)
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build
